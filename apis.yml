aid: arima-genomics
name: Arima Genomics
description: 'Arima Genomics is a San Diego based cancer diagnostics company built on
  Hi-C sequencing and 3D genome science. Founded in 2015 to study how DNA is organized
  in three dimensions, the company now develops clinical tests and technology platforms
  that detect cancer-driving structural alterations — noncanonical fusions, enhancer
  hijacking, extrachromosomal DNA (ecDNA) and complex rearrangements — from routine
  FFPE tumor tissue that conventional DNA and RNA profiling can leave unresolved. Its
  surface spans research products (Arima-HiC+, Arima High Coverage HiC, Promoter and
  Custom Capture HiC, HiC FFPE, Arima CiFi), lab services including Single Cell Methyl-3C
  and multi-omics, the Aventa FusionPlus and Aventa Lymphoma clinical tests, and biopharma
  partnership programs. Arima publishes open-source bioinformatics pipelines on GitHub
  (Arima-HiC mapping pipeline, Arima-CHiC, Arima-SV-Pipeline) but operates no public
  web API, developer portal or machine-readable specification.'
